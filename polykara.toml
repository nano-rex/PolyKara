# PolyKara presentation and chart configuration.

[video]
play_res_x = 1920
play_res_y = 1080
extend_intro = true

[render]
# FFmpeg encoder settings. Leave preset or crf empty ("") for encoders that do not use them,
# and pass their own options through extra_args, e.g. video_codec = "h264_nvenc", extra_args = ["-cq", "20"].
video_codec = "libx264"
preset = "medium"
crf = 18
pixel_format = "yuv420p"
audio_codec = "aac"
audio_bitrate = "192k"
extra_args = []

[logo]
# Image burned into every video; a logo_file value in songs.csv overrides it per song.
# Sizes and margins use the same 1920x1080 coordinate space as the subtitles.
file = ""
width = 220
position = "top-right"
margin_x = 40
margin_y = 40
opacity = 1.0

[title]
enabled = true
text = "{title}  |  {artist}"
font = "Arial"
size = 42
color = "&H00FFFFFF"
horizontal = "center"
vertical = "top"
margin_l = 40
margin_r = 40
margin_v = 40
start_ms = 0
duration_ms = 6000
fade_in_ms = 300
fade_out_ms = 300
bold = true
italic = false
outline = 2
shadow = 1

[credit]
enabled = true
text = "作词：{lyricist}    作曲：{composer}    字幕制作：{producer}"
font = "Arial"
size = 28
color = "&H00FFFFFF"
horizontal = "center"
vertical = "bottom"
margin_l = 40
margin_r = 40
margin_v = 70
start_ms = 0
duration_ms = 6000
fade_in_ms = 300
fade_out_ms = 300
bold = false
italic = false
outline = 2
shadow = 1

[lyric]
font = "Arial"
size = 58
color = "&H00FF0000"
secondary_color = "&H00FFFFFF"
outline_color = "&H80000000"
back_color = "&H50000000"
alignment = 2
margin_l = 80
margin_r = 80
margin_v = 150

[karaoke]
# \kf performs a smooth left-to-right fill over each timed word.
active_color = "&H00FF0000"
inactive_color = "&H00FFFFFF"
tag = "kf"

[romanization]
# Optional engines are installed with: pip install -r requirements-romanization.txt
enabled = true
languages = ["zh", "yue", "ja", "ko", "hi", "ta", "bn", "gu", "kn", "ml", "mr", "ne", "pa", "sa", "te", "or"]
font = "Arial"
size = 30
color = "&H00FFFFFF"
outline_color = "&H80000000"
back_color = "&H50000000"
horizontal = "center"
vertical = "bottom"
margin_l = 80
margin_r = 80
margin_v = 225
bold = false
italic = false
outline = 2
shadow = 1
# Mandarin: numbers (ni3 hao3) or marks (nǐ hǎo).
tone = "numbers"

[lyrics]
# Provider order. Use an empty list to disable automatic external lookup.
sources = ["lrclib", "lyrics.ovh", "webpage"]
# Use YouTube automatic captions when no better lyrics exist.
auto_captions = true

[alignment]
# auto reserves reserve_memory_gib for the system and selects a model from the thresholds.
# Set model to tiny/base/small/medium/large-v3 to disable automatic selection.
model = "auto"
device = "auto"
compute_type = "int8"
reserve_memory_gib = 2
base_min_budget_gib = 2
small_min_budget_gib = 4
medium_min_budget_gib = 8
large_min_budget_gib = 12
cpu_threads = 0
num_workers = 1

[timing]
long_pause_ms = 30000
dot_interval_ms = 1000
# Show each line this long before it is sung, when the previous line has already ended.
lead_in_ms = 500
# A line whose last word ends more than max_tail_ms before the next line leaves the
# screen tail_hold_ms after that word. Set max_tail_ms = 0 to keep lines until the next one.
max_tail_ms = 5000
tail_hold_ms = 1000

[singers]
max = 16

[prompt]
font = "Arial"
size = 44
color = "&H00FFFFFF"
alignment = 1
margin_l = 80
margin_r = 80
margin_v = 220

[watermark]
enabled = false
text = "PolyKara"
font = "Arial"
size = 24
color = "&H80FFFFFF"
alignment = 9
margin_l = 40
margin_r = 40
margin_v = 40

[charts]
# Remove a region code to disable it from default --trending selection.
enabled_regions = ["my", "id", "au", "ca", "sg", "tw", "hk", "jp", "kr", "in", "cn", "us", "gb"]
