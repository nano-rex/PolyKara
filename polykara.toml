# PolyKara presentation and chart configuration.

[video]
play_res_x = 1920
play_res_y = 1080
extend_intro = true

[render]
# FFmpeg encoder settings. Leave preset or crf empty ("") for encoders that do not use them,
# and pass their own options through extra_args, e.g. video_codec = "h264_nvenc", extra_args = ["-cq", "20"].
video_codec = "libx264"
preset = "medium"
crf = 18
pixel_format = "yuv420p"
audio_codec = "aac"
audio_bitrate = "192k"
extra_args = []
# Output frame: the video is brought to [video] play_res_x x play_res_y. A video of another
# shape (4:3, vertical, ...) is filled out with a blurred copy of itself ("blur"), black
# bars ("pad"), or left as it is ("none").
fit = "blur"
blur_sigma = 30
# Background for songs made from audio files without cover art (an ffmpeg colour name or 0xRRGGBB).
background_color = "black"

[logo]
# Image burned into every video; a logo_file value in songs.csv overrides it per song.
# Sizes and margins use the same 1920x1080 coordinate space as the subtitles.
file = ""
width = 160
position = "bottom-right"
margin_x = 60
margin_y = 230
opacity = 0.6

[layout]
# single: one line at a time (default). alternate: KTV style, lines alternate between
# a top row and a bottom row and appear lead_in_ms early so singers can read ahead.
mode = "single"
lead_in_ms = 1500
top_alignment = 1
bottom_alignment = 3

[title]
# [title] and [credit] are used by the "single" layout only.
enabled = true
text = "{title}  |  {artist}"
font = "Arial"
size = 42
color = "&H00FFFFFF"
horizontal = "center"
vertical = "top"
margin_l = 40
margin_r = 40
margin_v = 40
start_ms = 0
duration_ms = 6000
fade_in_ms = 300
fade_out_ms = 300
bold = true
italic = false
outline = 2
shadow = 1

[credit]
enabled = true
text = "作词：{lyricist}    作曲：{composer}    字幕制作：{producer}"
font = "Arial"
size = 28
color = "&H00FFFFFF"
horizontal = "center"
vertical = "bottom"
margin_l = 40
margin_r = 40
margin_v = 70
start_ms = 0
duration_ms = 6000
fade_in_ms = 300
fade_out_ms = 300
bold = false
italic = false
outline = 2
shadow = 1

[lyric]
font = "Arial"
size = 58
color = "&H00FF0000"
secondary_color = "&H00FFFFFF"
outline_color = "&H80000000"
back_color = "&H50000000"
alignment = 2
margin_l = 80
margin_r = 80
margin_v = 150

[karaoke]
# \kf performs a smooth left-to-right fill over each timed word.
active_color = "&H00FF0000"
inactive_color = "&H00FFFFFF"
tag = "kf"

[romanization]
# Lyrics in a non-Latin script get a romanized row above the original line.
# Engines: pip install -r requirements-romanization.txt (Korean needs none).
# "auto" romanizes every line written in a non-Latin script; a list such as
# ["zh", "ja"] limits it to those song languages. Words the engines misread are
# corrected from the word library (polykara/readings and <PolyKara folder>/readings).
enabled = true
languages = "auto"
font = "Arial"
size = 30
color = "&H00FFFFFF"
outline_color = "&H00000000"
back_color = "&H80000000"
horizontal = "center"
vertical = "bottom"
margin_l = 80
margin_r = 80
# Height of the romanized row above the bottom of the frame.
margin_v = 225
bold = false
italic = false
outline = 2
shadow = 1
# Mandarin pinyin: marks (nǐ hǎo), numbers (ni3 hao3) or none (ni hao).
tone = "none"

[lyrics]
# Provider order. Use an empty list to disable automatic external lookup.
sources = ["lrclib", "netease", "lyrics.ovh", "webpage"]
# Use YouTube automatic captions when no better lyrics exist.
auto_captions = true
# Accuracy check: a song's lyrics count as verified when at least min_sources lyric files
# (the lyrics_file, subtitles, captions, and each provider's file) agree with each other.
# agreement_threshold is the share of words two files must have in common, in order.
min_sources = 3
agreement_threshold = 0.6
# true skips songs whose lyrics are not verified instead of rendering them with a warning.
require_verified = false

[alignment]
# auto reserves reserve_memory_gib for the system and selects a model from the thresholds.
# Set model to tiny/base/small/medium/large-v3 to disable automatic selection.
model = "auto"
device = "auto"
compute_type = "int8"
reserve_memory_gib = 2
base_min_budget_gib = 2
small_min_budget_gib = 4
medium_min_budget_gib = 8
large_min_budget_gib = 12
cpu_threads = 0
num_workers = 1

[timing]
long_pause_ms = 10000
dot_interval_ms = 1000
# Show each line this long before it is sung, when the previous line has already ended.
lead_in_ms = 500
# A line whose last word ends more than max_tail_ms before the next line leaves the
# screen tail_hold_ms after that word. Set max_tail_ms = 0 to keep lines until the next one.
max_tail_ms = 5000
tail_hold_ms = 1000

[singers]
max = 16
# Fill colours by voice: the song's voice column in songs.csv (female/male/duet), or
# speaker tags in the lyrics such as [singer: 女], [singer: 男] and [singer: 合].
# Other speaker names get a colour of their own. show_label prefixes tagged lines
# with the name, e.g. "女：".
show_label = true
female_color = "&H000000FC"
male_color = "&H00882D14"
both_color = "&H00187E12"

[prompt]
font = "Arial"
size = 44
color = "&H00FFFFFF"
alignment = 1
margin_l = 80
margin_r = 80
margin_v = 220

[watermark]
enabled = false
text = "PolyKara"
font = "Arial"
size = 24
color = "&H80FFFFFF"
alignment = 9
margin_l = 40
margin_r = 40
margin_v = 40

[charts]
# Remove a region code to disable it from default --trending selection.
enabled_regions = ["my", "id", "au", "ca", "sg", "tw", "hk", "jp", "kr", "in", "cn", "us", "gb"]

[effects]
# Per-syllable karaoke effects: none, fade, pop, glow.
# Override a preset with your own ASS tags; {start} {mid} {end} {dur} {index} are
# milliseconds relative to the line, and any key in params is also available.
preset = "none"
# syllable = '\fscx100\t({start},{mid},\fscx{scale})\t({mid},{end},\fscx100)'
# line = '\fad({fade_in},{fade_out})'
[effects.params]
# scale = 125

[live]
# python3 pipeline.py live  ->  /dev/videoN needs v4l2loopback (OBS can capture it),
# or use an rtmp://, udp://, or srt:// URL. audio_output: none, pulse, or alsa.
target = "/dev/video10"
audio_output = "none"
audio_device = "default"

# Music player (`python3 pipeline.py player`): folders scanned for audio and video.
# Relative paths are inside the PolyKara folder. Lyrics are read from a sidecar file
# with the same name (.krc .qrc .ksc .lrc .ass .srt .vtt .txt), else looked up on LRCLIB.
# [player]
# library = ["~/Music", "work/output"]
