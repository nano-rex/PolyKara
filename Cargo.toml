[package]
name = "polykara-desktop"
version = "0.5.0"
edition = "2021"
description = "PolyKara desktop app for Windows: song list, timing editor and settings, driving the Python pipeline"
license = "GPL-3.0-or-later"
publish = false

# No dependencies, on purpose: only the Rust standard library and the Windows API.

[lib]
name = "polykara"
path = "src/lib.rs"

[[bin]]
name = "PolyKara"
path = "src/main.rs"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"
