[package]
name = "polykara"
version = "0.1.0"
edition = "2021"
description = "Multilingual karaoke subtitle automation"
license = "GPL-3.0"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
csv = "1"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
